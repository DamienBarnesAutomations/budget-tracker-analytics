services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: budget_tracker_bot
    volumes:
      - .:/app
    env_file:
      - .env
    restart: always
    environment:
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - GOOGLE_SHEET_ID=${GOOGLE_SHEET_ID}
      - PYTHONUNBUFFERED=1
    command: python app.py

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: budget_tracker_api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    restart: always
    environment:
      - GOOGLE_SHEET_ID=${GOOGLE_SHEET_ID}
      - PYTHONUNBUFFERED=1

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL}
    container_name: budget_tracker_frontend
    ports:
      - "3000:80"
    restart: always
    depends_on:
      - api
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL}
